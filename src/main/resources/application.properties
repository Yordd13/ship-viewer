shipviewer.aoi-file=${PIPELINE_HOME:C:/Users/yordd/OneDrive/\u0420\u0430\u0431\u043E\u0442\u0435\u043D \u043F\u043B\u043E\u0442/pipeline testing}/aoi.geojson

spring.jackson.default-property-inclusion=always

shipviewer.match-radius-meters=2000
shipviewer.ais-window-minutes=15

shipviewer.pipeline-dir=${PIPELINE_HOME:C:/Users/yordd/OneDrive/\u0420\u0430\u0431\u043E\u0442\u0435\u043D \u043F\u043B\u043E\u0442/pipeline testing}
shipviewer.go-command=go
shipviewer.area=bulgaria

spring.web.resources.cache.cachecontrol.no-cache=true

shipviewer.tiles-dir=${SHIP_TILES_HOME:C:/ship-tiles}

spring.config.import=optional:file:keycloak/.env[.properties],optional:file:${PIPELINE_HOME:}/mysql/.env[.properties]

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/ship_detections?connectionTimeZone=UTC
spring.datasource.username=app
spring.datasource.password=${APP_DB_PASSWORD}

spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.security.oauth2.client.registration.keycloak.client-id=ship-viewer
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ship-viewer}

spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
